<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#02050a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Pega Ponto</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="hud-item"><span>Fase</span><strong id="level">1/10</strong></div>
      <div class="hud-item"><span>Pontuacao</span><strong id="score">0</strong></div>
      <div class="hud-item"><span>Vidas</span><strong id="lives">3</strong></div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="672" height="672" aria-label="Jogo estilo pega ponto neon"></canvas>
      <div class="overlay" id="overlay">
        <h1>Pega Ponto</h1>
        <p id="overlay-text">Use as setas do teclado para jogar.</p>
        <button id="start-btn" type="button">Iniciar</button>
      </div>
    </section>

    <footer class="legend">
      <p>Setas: mover</p>
      <p>Coma todos os pontos para avancar de fase</p>
      <p>Pastilhas grandes ativam modo turbo temporario</p>
    </footer>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.error('Falha ao registrar service worker:', error);
        });
      });
    }
  </script>
  <script src="./game.js"></script>
</body>
</html>
